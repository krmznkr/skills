name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. For suspected vulnerabilities or leaked credentials, stop here and follow the repository's SECURITY.md instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
      placeholder: A concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the smallest reliable sequence, input, or example.
      placeholder: |
        1. Start with …
        2. Run or open …
        3. Observe …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release, tag, or commit SHA where this occurred.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Relevant operating system, browser, runtime, device, or deployment details.
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove secrets and personal data before attaching evidence.
